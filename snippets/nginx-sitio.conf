# Servidor del sitio estático (contenedor "web", nginx:alpine).
# Fragmento recortado del código real. La CSP está simplificada: en producción
# incluye además los dominios de la analítica y del chatbot, y los hashes de
# los scripts en línea.

server {
    listen 80;
    server_name _;

    root /site;
    index index.html;

    # detrás del proxy TLS: redirecciones relativas para no degradar a http
    absolute_redirect off;

    # el 410 enseña el mismo diseño que el 404, pero con su código
    error_page 404 /404.html;
    error_page 410 /404.html;

    # cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Scripts solo propios; los pocos scripts en línea van permitidos por hash
    # sha256 exacto, no con 'unsafe-inline'. El CSS sí va en línea por página.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-<HASH_SCRIPT_EN_LINEA>'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json text/plain application/xml;
    gzip_vary on;

    # URLs del WordPress anterior: 301 a su equivalente o 410 si ya no existe.
    # Los mapas $circo_redirect y $circo_gone están en otro fichero de conf.d.
    if ($circo_redirect) {
        return 301 $circo_redirect;
    }
    if ($circo_gone) {
        return 410;
    }
    if ($args ~* "add-to-cart=") {
        return 410;
    }

    # la web pública solo tiene dos puntos dinámicos: el formulario y su captcha
    location = /api/public/contact {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/public/captcha {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
